services:
  web:
    build:
      args:
        # Keep Codespaces previews on the authenticated port-3000 origin.
        # The Next.js route proxies REST calls to the private backend network.
        NEXT_PUBLIC_API_BASE_URL: /api/backend

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    network_mode: host
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "run", "--token-file", "/run/secrets/tunnel-token"]
    secrets:
      - tunnel-token
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_started
      mcp:
        condition: service_started
    security_opt: ["no-new-privileges:true"]

secrets:
  tunnel-token:
    file: ./.codespaces-secrets/cloudflare-tunnel-token
